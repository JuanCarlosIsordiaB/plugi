name: buscapila
services:
  database:
    image: postgres:18
    environment:
      POSTGRES_DB: ${PGDATABASE:?Set PGDATABASE in backend/.env}
      POSTGRES_USER: ${PGUSER:?Set PGUSER in backend/.env}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in backend/.env}
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
volumes:
  postgres_data:
